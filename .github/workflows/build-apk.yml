name: Build APK

on:
  push:
    branches: [ claude/wine-glass-vibration-app-vt6PM, main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew || echo "gradlew not found, will use gradle wrapper"

    - name: Setup Gradle wrapper
      run: gradle wrapper --gradle-version=8.1.1 || true

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: wine-glass-vibrator-debug
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Build Release APK (unsigned)
      run: ./gradlew assembleRelease || echo "Release build failed, debug APK available"
      continue-on-error: true

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: wine-glass-vibrator-release
        path: app/build/outputs/apk/release/app-release-unsigned.apk
      continue-on-error: true
